<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendario Estudiantil</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Barra de navegación -->
    <nav class="navbar">

        <div class="logo">
            📚 Calendario Estudiantil
        </div>

        <div class="buscador">
            <input 
                type="text" 
                placeholder="Buscar eventos..."
            >
            <button>🔍</button>
        </div>

        <div class="usuario">
            👤
        </div>

    </nav>


    <!-- Contenido principal -->
    <main class="principal">

        <!-- Encabezado del calendario -->
        <div class="encabezado">

            <button class="flecha" id="anterior">
                ‹
            </button>

            <h1 id="mesActual">
                Septiembre 2026
            </h1>

            <button class="flecha" id="siguiente">
                ›
            </button>

        </div>


        <!-- Calendario -->
        <section class="calendario">

            <!-- Días de la semana -->
            <div class="dias-semana">

                <div>Lun</div>
                <div>Mar</div>
                <div>Mié</div>
                <div>Jue</div>
                <div>Vie</div>
                <div>Sáb</div>
                <div>Dom</div>

            </div>

            <!-- Días del mes -->
            <div 
                class="dias" 
                id="diasCalendario">
            </div>

        </section>


        <!-- Leyenda -->
        <div class="leyenda">

            <div>
                <span class="color evento"></span>
                Eventos importantes
            </div>

            <div>
                <span class="color tarea"></span>
                Tareas y entregas
            </div>

            <div>
                <span class="color completado"></span>
                Completadas
            </div>

        </div>

    </main>


    <!-- JavaScript del calendario -->
    <script src="calendario.js"></script>

</body>
</html>
