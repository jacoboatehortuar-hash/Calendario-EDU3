<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario Estudiantil</title>

<link rel="stylesheet" href="Estilos2.css">
</head>
<body>

<div class="boton-centro">
    <button id="abrirModal">➕ Agregar Trabajo</button>
</div>

<div id="modal" class="modal">

    <div class="contenido-modal">

        <span class="cerrar">&times;</span>

        <h2>Agregar Trabajo</h2>

        <input type="text" id="nombre" placeholder="Nombre del trabajo">

        <input type="date" id="fecha">

        <input type="time" id="hora">

        <textarea id="descripcion" placeholder="Descripción"></textarea>

        <button id="guardar">Guardar Trabajo</button>

    </div>

</div>

<div class="contenedor-eliminar">
    <button id="btnEliminar" onclick="eliminarTodo()">
        🗑️ Eliminar todas las tareas
    </button>
</div>

<div class="contenedor-pendientes">

    <div class="pendientes">

        <h2>📋 Trabajos Pendientes</h2>

        <div id="listaTareas">
            <!-- Aquí aparecerán las tareas automáticamente -->
        </div>

    </div>

</div>

<script src="Tareas pendientes.js"></script>

<header>

    <nav class="navbar">

        <div class="logo">
            📅 Calendario Estudiantil
        </div>

        <div class="buscador">
            <input type="text" placeholder="Buscar...">
            <button>🔍</button>
        </div>

        <ul class="menu">
            <li><a href="#inicio">Inicio</a></li>
            <li><a href="#calendario">Calendario</a></li>
            <li><a href="#agregar">Agregar Trabajo</a></li>
            <li><a href="#pendientes">Pendientes</a></li>
            <li><a href="#contacto">Contacto</a></li>
        </ul>

    </nav>

</header>
</div>
</body>
</html>
